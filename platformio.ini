[platformio]
src_dir = Core/Src
include_dir = Core/Inc
default_envs = nucleo_c031c6
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_c031c6]
platform = ststm32
board = nucleo_c031c6
framework = stm32cube
monitor_speed = 115200
lib_deps = 
    https://github.com/eagletrt/libfsm-sw.git#dev

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags = 
    -std=gnu23
    -DUNIT_TEST
    -DEAGLETRT_STATIC=
    -lm
    -D_XOPEN_SOURCE
    -ICore/Inc
    -ICore/Inc/recruiting
    -Itest/include

build_src_filter = 
    -<**>
    +<recruiting/>

lib_deps = 
    https://github.com/eagletrt/libtimebase-sw
    https://github.com/eagletrt/libfsm-sw